<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#080205">
  <title>Hermes Exchange — Randomizer</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
  <script src="https://telegram.org/js/telegram-web-app.js?64"></script>
  <script src="/app.js" defer></script>
</head>
<body>
  <div class="bg"></div>
  <div class="aurora"></div>
  <div class="grain"></div>
  <div class="vignette"></div>

  <div class="app">
    <div class="header">
      <div class="logo-frame"><span>H</span></div>
      <div class="header-text">
        <h1>Hermes Exchange</h1>
        <p>Randomizer</p>
      </div>
    </div>

    <div class="stage" id="stage">
      <div class="ring"></div>
      <div class="display-box" id="displayBox">
        <div class="flash" id="flash"></div>
        <div class="number" id="number">?</div>
      </div>
    </div>

    <div class="input-row">
      <label>Участников</label>
      <input type="text" id="count" value="0" inputmode="numeric" readonly>
    </div>

    <button class="btn" id="mainBtn" disabled>Загрузка…</button>
    <button class="btn btn-ghost" id="secondBtn" hidden>Запустить</button>

    <p class="footer">Hermes Exchange</p>
  </div>
</body>
</html>
